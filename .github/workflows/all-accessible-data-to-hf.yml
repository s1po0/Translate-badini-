name: Train all accessible historical data on your Hugging Face AI
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/all-accessible-data-to-hf.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: all-word-training-result
          run-id: 40992691510
          github-token: ${{ github.token }}
          path: sources/english
      - uses: actions/download-artifact@v4
        with:
          name: all-badini-backtranslations
          run-id: 41044943082
          github-token: ${{ github.token }}
          path: sources/badini
      - uses: actions/download-artifact@v4
        with:
          name: two-related-teacher-agreement
          run-id: 41052181009
          github-token: ${{ github.token }}
          path: sources/agreement20
      - uses: actions/download-artifact@v4
        with:
          name: two-related-teacher-agreement
          run-id: 41051927869
          github-token: ${{ github.token }}
          path: sources/agreement8
      - uses: actions/download-artifact@v4
        with:
          name: two-related-teacher-agreement
          run-id: 41051656360
          github-token: ${{ github.token }}
          path: sources/agreement4
      - uses: actions/download-artifact@v4
        with:
          name: continuous-badini-checkpoints
          run-id: 40989117284
          github-token: ${{ github.token }}
          path: sources/continuous
      - uses: actions/download-artifact@v4
        with:
          name: balanced-word-training
          run-id: 41036334780
          github-token: ${{ github.token }}
          path: sources/balanced
      - uses: actions/download-artifact@v4
        with:
          name: numbered-word-distillation
          run-id: 40991850346
          github-token: ${{ github.token }}
          path: sources/pilot
      - uses: actions/download-artifact@v4
        with:
          name: dasinya-badini-student
          run-id: 41041856775
          github-token: ${{ github.token }}
          path: sources/corpus-pilot
      - name: Merge accessible historical datasets with provenance
        run: |
          python tools/merge_all_training_data.py --english sources/english --badini sources/badini --agreement20 sources/agreement20 --agreement8 sources/agreement8 --agreement4 sources/agreement4 --continuous sources/continuous --balanced sources/balanced --pilot sources/pilot --corpus-pilot sources/corpus-pilot --output merged
          python tools/prepare_word_training.py --synthetic merged/synthetic.csv --shard-count 50 --output shards
      - name: Save data coverage and original IDs
        uses: actions/upload-artifact@v4
        with:
          name: all-accessible-training-data
          path: merged/
          retention-days: 90
      - name: Save source-disjoint shards
        uses: actions/upload-artifact@v4
        with:
          name: word-training-shards
          path: shards/
          retention-days: 90
  baseline:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for earlier Hugging Face training round
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 41064618983 --interval 60
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/41064618983 --jq .status)" = completed
      - name: Install Hub client
        run: python -m pip install 'huggingface_hub==0.36.2'
      - name: Pin the latest model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/hf_training_round.py snapshot --output baseline/accepted-adapter --ref baseline/baseline-ref.json
      - name: Save pinned starting checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: all-data-hf-baseline
          path: baseline/
          retention-days: 90
  stage1:
    needs: baseline
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 1
      previous-name: all-data-hf-baseline
      previous-run: ${{ github.run_id }}
      retention: 90
  stage2:
    needs: stage1
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 2
      previous-name: word-stage-1
      previous-run: ${{ github.run_id }}
      retention: 7
