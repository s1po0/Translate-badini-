      previous-run: ${{ github.run_id }}
      retention: 90
  finalize:
    needs: stage50
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4' 'huggingface_hub==0.36.2'
      - uses: actions/download-artifact@v4
        with:
          name: all-data-hf-baseline
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: word-stage-1
          path: first
      - uses: actions/download-artifact@v4
        with:
          name: word-stage-50
          path: final
      - name: Compare final checkpoint to original Hugging Face model
        run: |
          initial="$(find baseline -type d -name accepted-adapter -print -quit)"
          selected="$(find final -type d -name accepted-adapter -print -quit)"
          test -f "$initial/adapter_config.json" && test -f "$selected/adapter_config.json"
          python tools/evaluate_word_quality.py --before "$initial" --after "$selected" --size 100 --output final-words.json
      - name: Decide whether final checkpoint is safe to publish
        id: decision
        run: python tools/finalize_all_training.py --first first --final final --words final-words.json --stages 50 --output decision.json
      - name: Save final decision
        uses: actions/upload-artifact@v4
        with:
          name: all-data-final-evaluation
          path: |
            final-words.json
            decision.json
          retention-days: 90
      - name: Update Hugging Face only if guards pass and revision is unchanged
        if: steps.decision.outputs.accepted == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          initial="$(find baseline -type d -name accepted-adapter -print -quit)"
          selected="$(find final -type d -name accepted-adapter -print -quit)"
          python tools/hf_training_round.py publish --baseline "$initial" --candidate "$selected" --ref baseline/baseline-ref.json --decision decision.json --run-id '${{ github.run_id }}' --output upload
