name: Translate all indexed English words

on:
  workflow_dispatch:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths:
      - '.github/workflows/all-english-word-distillation.yml'

permissions:
  contents: read
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        start: [1, 25001, 50001, 75001, 100001, 125001, 150001, 175001, 200001, 225001, 250001, 275001, 300001, 325001, 350001]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - name: Translate words with Badini teacher
        run: python translate_english_words.py --start ${{ matrix.start }} --count 25000 --batch-size 8 --output output
      - name: Upload numbered translations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-batch-${{ matrix.start }}
          path: output/
          if-no-files-found: warn
          retention-days: 90

  train:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - uses: actions/download-artifact@v4
        with:
          pattern: word-batch-*
          path: batches
      - name: Verify complete coverage and combine training data
        run: python tools/merge_translated_words.py --input batches --output models/all-words
      - name: Download previous two-round checkpoint
        uses: actions/download-artifact@v4
        with:
          name: continuous-badini-checkpoints
          path: models/prior
          run-id: 40989117284
          github-token: ${{ github.token }}
      - name: Locate accepted adapter
        run: |
          python - <<'PY'
          import json, pathlib
          states = list(pathlib.Path('models/prior').rglob('state.json'))
          if len(states) != 1: raise RuntimeError('Expected exactly one previous state')
          state = json.loads(states[0].read_text())
          adapter = states[0].parent / state['adapter']
          if not (adapter / 'adapter_config.json').is_file(): raise RuntimeError('Previous adapter missing')
          pathlib.Path('/tmp/prior-adapter').write_text(str(adapter))
          PY
      - name: Train on a sample from all generated pairs
        run: |
          python train_adapter.py --initial-adapter "$(cat /tmp/prior-adapter)" --synthetic-data models/all-words/synthetic.csv --synthetic-repeats 1 --steps 6000 --per-language 100 --output models/all-words/candidate
      - name: Evaluate candidate before promotion
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          from continuous_training import accepted
          root = pathlib.Path('models/all-words')
          report = json.loads((root / 'candidate/report.json').read_text())
          keep = accepted(report, 0.03)
          shutil.copytree(root / 'candidate/adapter' if keep else pathlib.Path('/tmp/prior-adapter').read_text(), root / 'accepted-adapter')
          result = {'candidate_accepted': keep, 'optimizer_steps': 6000, 'warning': 'Generated pairs are unverified. 6000 steps train on only a sample; loss is not translation accuracy.'}
          (root / 'decision.json').write_text(json.dumps(result, indent=2))
          print('::notice title=All-words training decision::' + json.dumps(result))
          print('::notice title=All-words training report::' + json.dumps(report))
          PY
      - name: Upload dataset, report and adapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-word-training-result
          path: models/all-words/
          if-no-files-found: warn
          retention-days: 90
