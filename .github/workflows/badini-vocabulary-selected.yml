      retention: 7
  stage18:
    needs: stage17
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 18
      previous-name: word-stage-17
      previous-run: ${{ github.run_id }}
      retention: 7
  stage19:
    needs: stage18
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 19
      previous-name: word-stage-18
      previous-run: ${{ github.run_id }}
      retention: 7
  stage20:
    needs: stage19
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 20
      previous-name: word-stage-19
      previous-run: ${{ github.run_id }}
      retention: 90
  finalize:
    needs: stage20
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: word-stage-20
          path: completed
      - name: Verify final progress
        run: |
          python - <<'CHECK'
          import json
          from pathlib import Path
          p = Path('completed')
          paths = list(p.rglob('progress.json'))
          adapters = list(p.rglob('accepted-adapter/adapter_config.json'))
          assert len(paths) == 1 and len(adapters) == 1
          report = json.loads(paths[0].read_text())
          assert len(report['stages']) == 20 and report['planned_examples'] == 93373
          print('::notice title=Completed vocabulary training::' + json.dumps(report))
          CHECK
      - name: Save final selected adapter and progress
        uses: actions/upload-artifact@v4
        with:
          name: selected-latest-vocabulary-adapter
          path: completed/
          retention-days: 90
