name: Check private standalone model size
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/check-private-model-size.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub==0.36.2'
      - name: Check the private model's file sizes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          from huggingface_hub.hf_api import RepoFile
          api=HfApi(token=os.environ['HF_TOKEN'])
          repo='sipan69/Badini-ai'
          info=api.repo_info(repo_id=repo,repo_type='model')
          if not info.private: raise RuntimeError('Model repository is not private')
          entries=list(api.list_repo_tree(repo_id=repo,path_in_repo='merged-full-model',recursive=True,revision=info.sha,repo_type='model'))
          files=[x for x in entries if isinstance(x,RepoFile)]
          weights=[x for x in files if x.path.endswith('.safetensors')]
          if not files or not weights: raise RuntimeError('Standalone files missing')
          total=sum(x.size for x in files)
          weight_size=sum(x.size for x in weights)
          print(f'::notice title=Private model size::total_bytes={total}; weights_bytes={weight_size}; file_count={len(files)}')
          PY
