name: Test continuous Badini training

on:
  workflow_dispatch:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths:
      - '.github/workflows/continuous-badini-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  test-continuous-training:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - name: Download previously trained adapter
        uses: actions/download-artifact@v4
        with:
          name: badini-adapter
          path: models/badini-adapter
          run-id: 40986771788
          github-token: ${{ github.token }}
      - name: Run two real teacher-student training rounds
        shell: bash
        run: |
          set -o pipefail
          trap 'echo "::error::Continuous training failed. See uploaded diagnostic log."' ERR
          python continuous_training.py --initial-adapter models/badini-adapter/adapter --output models/continuous --allow-download --batch-per-language 2 --steps 25 --max-cycles 2 2>&1 | tee /tmp/continuous-training.log
      - name: Publish evaluation
        if: success()
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('models/continuous')
          state = json.loads((root / 'state.json').read_text())
          print('::notice title=Continuous training state::' + json.dumps(state, ensure_ascii=True), flush=True)
          for report in sorted((root / 'rounds').glob('*/model/report.json')):
              print('::notice title=Round evaluation::' + json.dumps(json.loads(report.read_text()), ensure_ascii=True), flush=True)
          PY
      - name: Upload checkpoints and training log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-badini-checkpoints
          path: |
            models/continuous/
            /tmp/continuous-training.log
          if-no-files-found: warn
          retention-days: 30
