name: Evaluate private translator
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/evaluate-private-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4' 'huggingface_hub==0.36.2' 'hf_xet' 'sacrebleu==2.5.1'
      - name: Test evaluation sampling
        run: python -m unittest discover -s tests -p test_compare_private_model.py
      - name: Evaluate privately and encrypt aggregate result
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          cat > public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyHvF5MhsXk0J89XqTEM1
          k1msmOhOyUSxtwEOY6plD68ngx7VlER0BDp62ooLgWRdvourKdpbJAQAh0s89sPU
          zHkwY9pe6hsS2cHxsLWLrEMt8y3ziqSewC7yqSbRCg9gkYMOyRzUvf0QU6LRi3yO
          yvPFY/K0cJT2fmp1DhqtIXnTKnr8WOnF/C12m91lnBHRj+699BVr5pRnDA2DSgBH
          1Y+Y7ST4sZ07oI499O+I2+USgKpuj8ZcuzZxIO7n13n31gAvgKgSE7Uore4H2AsG
          gm9xV5Wz6TEUe1fwHtybUp5Rw9KeC9XtCWYmP15YIXa0hjk4Hm7r1hSujjPVxD8+
          JwIDAQAB
          -----END PUBLIC KEY-----
          KEY
          set +e
          python tools/compare_private_model.py > evaluate.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tail -c 120 evaluate.log > failure.txt
            openssl pkeyutl -encrypt -pubin -inkey public.pem -pkeyopt rsa_padding_mode:oaep -in failure.txt -out failure.bin
            echo "::error title=Encrypted evaluation failure::$(base64 -w0 failure.bin)"
            exit "$code"
          fi
          gzip -c private-scores.json > scores.gz
          openssl pkeyutl -encrypt -pubin -inkey public.pem -pkeyopt rsa_padding_mode:oaep -in scores.gz -out scores.bin
          echo "::notice title=Encrypted evaluation result::$(base64 -w0 scores.bin)"
