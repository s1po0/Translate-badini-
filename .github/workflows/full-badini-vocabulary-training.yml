name: Train on Dasinya Badini vocabulary
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/full-badini-vocabulary-training.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        start: [1, 10001, 20001, 30001, 40001, 50001, 60001, 70001, 80001, 90001]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - uses: actions/download-artifact@v4
        with:
          name: dasinya-badini-student
          run-id: 41041856775
          github-token: ${{ github.token }}
          path: corpus
      - name: Generate English labels for Badini words
        run: |
          vocab="$(find corpus -name badini-vocabulary.tsv.gz -type f -print -quit)"
          test -n "$vocab"
          python tools/backtranslate_badini_vocab.py --vocabulary "$vocab" --start '${{ matrix.start }}' --count 10000 --batch-size 8 --output output
      - name: Upload numbered attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badini-back-${{ matrix.start }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
  prepare:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dasinya-badini-student
          run-id: 41041856775
          github-token: ${{ github.token }}
          path: corpus
      - uses: actions/download-artifact@v4
        with:
          pattern: badini-back-*
          path: batches
      - name: Verify every numbered form and make source-disjoint shards
        run: |
          vocab="$(find corpus -name badini-vocabulary.tsv.gz -type f -print -quit)"
          test -n "$vocab"
          python tools/merge_badini_backtranslations.py --vocabulary "$vocab" --input batches --output combined
          python tools/prepare_word_training.py --synthetic combined/synthetic.csv --output shards --shard-count 20
      - uses: actions/upload-artifact@v4
        with:
          name: all-badini-backtranslations
          path: combined/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: word-training-shards
          path: shards/
          retention-days: 7
  stage1:
    needs: prepare
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 1
      previous-name: dasinya-badini-student
      previous-run: '41041856775'
      retention: 2
  stage2:
    needs: stage1
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 2
      previous-name: word-stage-1
      previous-run: ${{ github.run_id }}
      retention: 2
  stage3:
    needs: stage2
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 3
      previous-name: word-stage-2
      previous-run: ${{ github.run_id }}
      retention: 2
  stage4:
    needs: stage3
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 4
      previous-name: word-stage-3
      previous-run: ${{ github.run_id }}
      retention: 2
  stage5:
    needs: stage4
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 5
      previous-name: word-stage-4
      previous-run: ${{ github.run_id }}
      retention: 2
  stage6:
