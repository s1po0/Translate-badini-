name: Train on all available numbered word pairs
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/full-word-training.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all-word-training-result
          run-id: 40992691510
          github-token: ${{ github.token }}
          path: source
      - name: Prepare source-disjoint training shards
        run: |
          synthetic="$(find source -name synthetic.csv -type f -print -quit)"
          test -n "$synthetic"
          python tools/prepare_word_training.py --synthetic "$synthetic" --output shards --shard-size 5000
          python -c "import json; m=json.load(open('shards/manifest.json')); assert m['training_rows']==123524 and len(m['shards'])==25"
      - uses: actions/upload-artifact@v4
        with:
          name: word-training-shards
          path: shards/
          retention-days: 7
  stage1:
    needs: prepare
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 1
      previous-name: balanced-word-training
      previous-run: '41036334780'
      retention: 2
  stage2:
    needs: stage1
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 2
      previous-name: word-stage-1
      previous-run: ${{ github.run_id }}
      retention: 2
  stage3:
    needs: stage2
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 3
      previous-name: word-stage-2
      previous-run: ${{ github.run_id }}
      retention: 2
  stage4:
    needs: stage3
    uses: ./.github/workflows/word-shard-stage.yml
    with:
      stage: 4
      previous-name: word-stage-3
      previous-run: ${{ github.run_id }}
      retention: 2
  stage5:
    needs: stage4
