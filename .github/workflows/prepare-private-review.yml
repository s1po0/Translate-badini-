name: Prepare private teaching channel
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/prepare-private-review.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=42,<47' 'huggingface_hub==0.36.2'
      - name: Prepare encrypted private channel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          from tools.hf_training_round import REPO
          if not HfApi(token=os.environ['HF_TOKEN']).repo_info(repo_id=REPO,repo_type='model').private:
              raise ValueError('Teaching requires a private model repository')
          PY
          python tools/private_review_channel.py create sealed
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-review-channel
          path: sealed/sealed-key.json
          if-no-files-found: error
          retention-days: 1
