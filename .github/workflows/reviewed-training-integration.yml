name: Test reviewed-example neural training
on:
  workflow_dispatch:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/reviewed-training-integration.yml']
permissions:
  contents: read
  actions: read
jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - uses: actions/download-artifact@v4
        with:
          name: parallel-badini-selected
          run-id: 41047507896
          github-token: ${{ github.token }}
          path: previous
      - name: Train on nonprivate test fixtures only
        run: |
          adapter="$(find previous -type d -name accepted-adapter -print -quit)"
          test -f "$adapter/adapter_config.json"
          python tools/train_reviewed.py --backup tests/fixtures/reviewed-demo.json --initial-adapter "$adapter" --output experiment --replay-per-language 2 --reviewed-repeats 1 --eval-per-language 8 --word-eval-size 20
          python - "$adapter" <<'PY'
          import hashlib, json, pathlib, sys
          baseline = pathlib.Path(sys.argv[1]) / 'adapter_model.safetensors'
          candidate = pathlib.Path('experiment/candidate/adapter/adapter_model.safetensors')
          assert hashlib.sha256(baseline.read_bytes()).digest() != hashlib.sha256(candidate.read_bytes()).digest(), 'Candidate weights did not change'
          report = json.loads(pathlib.Path('experiment/candidate/report.json').read_text())
          assert report['reviewed_unique_rows'] == 2
          assert report['training_pool_pairs'] == report['optimizer_steps']
          print('Integration passed: both fixture examples included and neural adapter weights changed.')
          PY
      - name: Publish test metrics only, not model weights
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-training-integration-metrics
          path: |
            experiment/selection.json
            experiment/word-evaluation.json
            experiment/candidate/report.json
          retention-days: 30
