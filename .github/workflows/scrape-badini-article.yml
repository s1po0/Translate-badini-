name: Collect open Badini word examples with Scrapling
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/scrape-badini-article.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Scrapling
        run: python -m pip install 'scrapling[fetchers]==0.4.15'
      - name: Test extraction
        run: python -m unittest discover -s tests -p test_scrape_badini_article.py
      - name: Collect the permitted article's word tables
        run: |
          set +e
          python tools/scrape_badini_article.py --output collected > scrape.log 2>&1
          code=$?
          cat scrape.log
          if [ "$code" -ne 0 ]; then
            python -c "from pathlib import Path; print('::error title=Collection failed::' + Path('scrape.log').read_text()[-3000:].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))"
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: scraped-badini-contextual-glosses
          path: collected/
          if-no-files-found: error
          retention-days: 90
