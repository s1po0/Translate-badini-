name: Collect open Badini word examples with Scrapling
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Scrapling
        run: python -m pip install 'scrapling[fetchers]==0.4.15'
      - name: Test extraction
        run: python -m unittest discover -s tests -p test_scrape_badini_article.py
      - name: Collect the permitted article's word tables
        run: python tools/scrape_badini_article.py --output collected
      - uses: actions/upload-artifact@v4
        with:
          name: scraped-badini-contextual-glosses
          path: collected/
          if-no-files-found: error
          retention-days: 90
