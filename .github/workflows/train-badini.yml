name: Train Badini adapter (experimental)

on:
  workflow_dispatch:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths:
      - '.github/workflows/train-badini.yml'
      - 'train_adapter.py'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - name: Train and evaluate
        run: python train_adapter.py --output models/badini-adapter
      - name: Upload trained adapter and report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: badini-adapter
          path: models/badini-adapter/
          if-no-files-found: error
          retention-days: 30
