name: Train the user's Hugging Face Badini adapter
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/train-huggingface-model.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training runtime
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4' 'huggingface_hub==0.36.2'
      - name: Capture the current Hugging Face checkpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/hf_training_round.py snapshot --output baseline --ref baseline-ref.json
      - name: Download agreed teacher examples
        uses: actions/download-artifact@v4
        with:
          name: two-related-teacher-agreement
          run-id: 41052181009
          github-token: ${{ github.token }}
          path: consensus
      - name: Fine-tune a candidate from the captured checkpoint
        run: |
          python train_adapter.py --initial-adapter baseline --synthetic-data consensus/synthetic.csv --synthetic-repeats 1 --steps 2000 --per-language 200 --eval-per-language 20 --learning-rate 0.00001 --seed 42 --output candidate
          python tools/evaluate_word_quality.py --before baseline --after candidate/adapter --size 100 --output candidate/word-evaluation.json
      - name: Decide whether to retain the candidate
        id: decision
        run: python tools/hf_training_round.py decide --report candidate/report.json --words candidate/word-evaluation.json --output decision.json
      - name: Save training result and previous checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: hf-badini-training-result
          path: |
            baseline/
            baseline-ref.json
            candidate/adapter/
            candidate/report.json
            candidate/word-evaluation.json
            decision.json
          retention-days: 90
      - name: Publish only a passing candidate without overwriting concurrent changes
        if: steps.decision.outputs.accepted == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/hf_training_round.py publish --baseline baseline --candidate candidate/adapter --ref baseline-ref.json --decision decision.json --run-id '${{ github.run_id }}' --output upload
