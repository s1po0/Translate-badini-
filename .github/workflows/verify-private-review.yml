name: Verify private teaching results
on:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths: ['.github/workflows/verify-private-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install verification runtime
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4' 'huggingface_hub==0.36.2' 'hf_xet' 'cryptography>=42,<47'
      - name: Verify private full model and encrypt results
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set +e
          python tools/verify_private_reviewed_model.py > private.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tail -c 5000 private.log > failure.txt
            echo "::error title=Encrypted verification failure::$(python tools/encrypt_eval_result.py .github/private-review/result-public.pem failure.txt)"
            exit "$code"
          fi
          echo "::notice title=Encrypted private verification::$(python tools/encrypt_eval_result.py .github/private-review/result-public.pem verification.json)"
