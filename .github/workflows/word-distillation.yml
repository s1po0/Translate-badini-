name: Distill numbered English words into Badini adapter

on:
  workflow_dispatch:
  push:
    branches: [arena/abe27edd-translate-badini]
    paths:
      - '.github/workflows/word-distillation.yml'

permissions:
  contents: read
  actions: read

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - name: Download previous two-round checkpoint
        uses: actions/download-artifact@v4
        with:
          name: continuous-badini-checkpoints
          path: models/prior
          run-id: 40989117284
          github-token: ${{ github.token }}
      - name: Find accepted previous adapter
        run: |
          python - <<'PY'
          import json, pathlib
          states = list(pathlib.Path('models/prior').rglob('state.json'))
          if len(states) != 1:
              raise RuntimeError(f'Expected one training state, found {len(states)}')
          root = states[0].parent
          state = json.loads(states[0].read_text())
          adapter = root / state['adapter']
          if not (adapter / 'adapter_config.json').is_file():
              raise RuntimeError('Previous accepted adapter is missing')
          pathlib.Path('/tmp/prior-adapter').write_text(str(adapter))
          print('Prior cycle:', state['cycle'])
          PY
      - name: Translate numbered English words
        run: python translate_english_words.py --start 1 --count 512 --batch-size 8 --output models/word-distillation/words
      - name: Continue training personal adapter on generated pairs
        run: |
          python train_adapter.py --initial-adapter "$(cat /tmp/prior-adapter)" --synthetic-data models/word-distillation/words/synthetic.csv --synthetic-repeats 1 --steps 600 --per-language 100 --output models/word-distillation/candidate
      - name: Check loss and select adapter
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          from continuous_training import accepted
          root = pathlib.Path('models/word-distillation')
          report = json.loads((root / 'candidate/report.json').read_text())
          keep = accepted(report, 0.03)
          current = root / 'accepted-adapter'
          shutil.copytree(root / 'candidate/adapter' if keep else pathlib.Path('/tmp/prior-adapter').read_text(), current)
          decision = {'candidate_accepted': keep, 'words_start': 1, 'words_requested': 512, 'warning': 'Translations are unverified; loss is not translation accuracy.'}
          (root / 'decision.json').write_text(json.dumps(decision, indent=2))
          print('::notice title=Distillation decision::' + json.dumps(decision), flush=True)
          print('::notice title=Distillation loss::' + json.dumps(report), flush=True)
          PY
      - name: Upload translated pairs and adapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numbered-word-distillation
          path: models/word-distillation/
          if-no-files-found: warn
          retention-days: 90
