name: Train one numbered word shard
on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      previous-name:
        type: string
        required: true
      previous-run:
        type: string
        required: true
      replay:
        type: number
        default: 200
      retention:
        type: number
        default: 2
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.46.3' 'peft==0.13.2' 'accelerate>=0.26,<2' 'sentencepiece>=0.2' 'protobuf>=3.20' 'safetensors>=0.4'
      - uses: actions/download-artifact@v4
        with:
          name: word-training-shards
          path: shards
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous-name }}
          path: previous
          run-id: ${{ inputs.previous-run }}
          github-token: ${{ github.token }}
      - name: Train one full shard and evaluate
        run: |
          python tools/word_shard_stage.py --stage '${{ inputs.stage }}' --shards shards --previous previous --output result --replay-per-language '${{ inputs.replay }}'
      - name: Save selected adapter and progress
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word-stage-${{ inputs.stage }}
          path: |
            result/accepted-adapter/
            result/progress.json
            result/training-report.json
            result/word-evaluation.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention }}
